<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ATTENTION : Message Important — Protocole MPH</title>

  <!-- SCRIPT KASHPAY (COM SUPORTE A DELAY DE 220s / 3m40s) -->
  <script src="https://checkout.kashpay.com.br/scripts/upsell-processor.js" data-kashpay-upsell-delay-support></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Topo de Alerta Vermelho */
    .top-bar {
      width: 100%;
      background-color: #cc0000;
      color: #ffffff;
      text-align: center;
      padding: 12px 16px;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .top-bar p {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
      color: #ffcccc;
      text-transform: none;
    }

    /* Area do Header */
    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 24px 16px 16px 16px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
    }

    header h2 span {
      color: #22c55e;
    }

    /* Container Principal */
    main {
      width: 100%;
      max-width: 800px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Wrapper do Player VTurb */
    .video-wrapper {
      width: 100%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 12px;
    }

    .vturb-placeholder {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
    }

    /* Barra de Progresso */
    .progress-container {
      width: 100%;
      background-color: #e5e7eb;
      border-radius: 4px;
      height: 24px;
      position: relative;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-bar {
      width: 84%;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Container dos Botões KashPay */
    .kashpay-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Topo de Alerta Red Box -->
  <div class="top-bar">
    NE FERMEZ PAS CETTE PAGE.
    <p>Ne cliquez pas sur le bouton « Retour » et évitez ainsi une double facturation</p>
  </div>

  <!-- Headlines -->
  <header>
    <h1>BIENVENUE AU PROTOCOLE MPH.</h1>
    <h2>REGARDEZ LE DERNIER AVIS DE 3 MINUTES DU <span>DR. JULIEN MOREAU</span></h2>
  </header>

  <!-- Player e Progress Bar -->
  <main>
    <div class="video-wrapper">
      <!-- COLE O SCRIPT DA VTURB AQUI DENTRO -->
      <div class="vturb-placeholder">
        [ Cole aqui o código de Embed da VTurb ]
      </div>
    </div>

    <!-- Barra de Progresso 84% -->
    <div class="progress-container">
      <div class="progress-bar">
        <span>achat presque terminé...</span>
        <span>84%</span>
      </div>
    </div>

    <!-- ÁREA DOS BOTÕES KASHPAY (COM DELAY DE 220s GERENCIADO PELO SCRIPT) -->
    <div class="kashpay-wrapper">
      <div data-kashpay-upsell-delay="220" style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
        <button type="button" onclick="acceptUpsell('https://checkout.kashpay.com.br/u/24f842e9f6d18fcc')" style="font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3; color: #ffffff; background-color: #057932; border: none; border-radius: 10px; padding: 16px 7%; cursor: pointer; text-align: center; display: block; margin: auto; width: 100%; max-width: 500px; box-shadow: 0 4px 14px rgba(5, 121, 50, 0.4);">
          OUI ! AJOUTER À MON COMMANDE POUR 37 €
        </button>
        <button type="button" onclick="declineUpsell('https://checkout.kashpay.com.br/u/24f842e9f6d18fcc')" style="font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.3; color: #ffffff; background-color: #dc2626; border: none; border-radius: 10px; padding: 12px 5%; cursor: pointer; text-align: center; display: block; margin: auto; width: 100%; max-width: 450px;">
          Non merci, je refuse l'Accélérateur 7X
        </button>
      </div>
    </div>
  </main>

  <!-- SCRIPT DE BACK REDIRECT PARA O DOWNSELL -->
  <script>
    (function () {
      var downsellUrl = 'https://downsell01-mu.vercel.app/';

      history.pushState(null, null, location.href);
      window.onpopstate = function () {
        history.pushState(null, null, location.href);
        window.location.href = downsellUrl;
      };
    })();
  </script>

</body>
</html>
