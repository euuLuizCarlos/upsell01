<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ATTENTION : Message Important — Protocole MPH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Topo de Alerta Vermelho */
    .top-bar {
      width: 100%;
      background-color: #cc0000;
      color: #ffffff;
      text-align: center;
      padding: 12px 16px;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .top-bar p {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
      color: #ffcccc;
      text-transform: none;
    }

    /* Area do Header */
    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 24px 16px 16px 16px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
    }

    header h2 span {
      color: #22c55e;
    }

    /* Container Principal */
    main {
      width: 100%;
      max-width: 800px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Wrapper do Player VTurb */
    .video-wrapper {
      width: 100%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 12px;
    }

    .vturb-placeholder {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
    }

    /* Barra de Progresso */
    .progress-container {
      width: 100%;
      background-color: #e5e7eb;
      border-radius: 4px;
      height: 24px;
      position: relative;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-bar {
      width: 84%;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Container da KashPay (Escondido por padrao para acompanhar o Delay) */
    .kashpay-container {
      width: 100%;
      display: none; 
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Topo de Alerta Red Box -->
  <div class="top-bar">
    NE FERMEZ PAS CETTE PAGE.
    <p>Ne cliquez pas sur le bouton « Retour » et évitez ainsi une double facturation</p>
  </div>

  <!-- Headlines -->
  <header>
    <h1>BIENVENUE AU PROTOCOLE MPH.</h1>
    <h2>REGARDEZ LE DERNIER AVIS DE 3 MINUTES DU <span>DR. JULIEN MOREAU</span></h2>
  </header>

  <!-- Player e Progress Bar -->
  <main>
    <div class="video-wrapper">
      <!-- COLE O SCRIPT DA VTURB AQUI DENTRO -->
      <div class="vturb-placeholder">
        [ Cole aqui o código de Embed da VTurb ]
      </div>
    </div>

    <!-- Barra de Progresso 84% -->
    <div class="progress-container">
      <div class="progress-bar">
        <span>achat presque terminé...</span>
        <span>84%</span>
      </div>
    </div>

    <!-- ÁREA DOS BOTÕES DA KASHPAY (COM DELAY CONFIGURADO) -->
    <div id="kashpay-pitch" class="kashpay-container">
      <!-- COLE AQUI O SCRIPT / BOTÃO NATIVO DA KASHPAY -->
    </div>
  </main>

  <!-- Script para exibiçao com Delay -->
  <script>
    // Tempo de delay em segundos (ex: 150s = 2 min e 30s)
    const DELAY_IN_SECONDS = 150; 

    setTimeout(function() {
      document.getElementById('kashpay-pitch').style.display = 'flex';
    }, DELAY_IN_SECONDS * 1000);
  </script>

</body>
</html>
